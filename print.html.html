<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Currículo para Impressão</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            margin: 40px;
            color: #1e293b;
        }

        .topo {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .topo img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d9e2c8;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        h2 {
            margin-top: 25px;
            margin-bottom: 8px;
            font-size: 18px;
            color: #0f172a;
        }

        .secao {
            margin-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="topo">
        <img id="foto-impressao" src="https://via.placeholder.com/140" alt="Foto do aluno">
        <div>
            <h1>Currículo Profissional</h1>
            <p>Versão para impressão</p>
        </div>
    </div>

    <div class="secao">
        <h2>Sobre mim</h2>
        <div id="imp-sobre"></div>
    </div>

    <div class="secao">
        <h2>Objetivo Profissional</h2>
        <div id="imp-objetivo"></div>
    </div>

    <div class="secao">
        <h2>Experiência</h2>
        <div id="imp-experiencia"></div>
    </div>

    <div class="secao">
        <h2>Formação</h2>
        <div id="imp-formacao"></div>
    </div>

    <div class="secao">
        <h2>Habilidades Técnicas</h2>
        <div id="imp-habilidades"></div>
    </div>

    <div class="secao">
        <h2>Habilidades Socioemocionais</h2>
        <div id="imp-socioemocionais"></div>
    </div>

    <div class="secao">
        <h2>Valores Pessoais</h2>
        <div id="imp-valores"></div>
    </div>

    <div class="secao">
        <h2>Histórias de Superação</h2>
        <div id="imp-superacao"></div>
    </div>

    <div class="secao">
        <h2>Responsabilidades Fora da Escola</h2>
        <div id="imp-responsabilidades"></div>
    </div>

    <div class="secao">
        <h2>Portfólio</h2>
        <div id="imp-portfolio"></div>
    </div>

    <script>
        const STORAGE_PREFIX = "curriculo_social_";

        function carregarCampo(id, key) {
            const el = document.getElementById(id);
            const valor = localStorage.getItem(STORAGE_PREFIX + key);
            el.innerHTML = valor ? valor : "<em>Sem conteúdo preenchido.</em>";
        }

        carregarCampo("imp-sobre", "sobre");
        carregarCampo("imp-objetivo", "objetivo");
        carregarCampo("imp-experiencia", "experiencia");
        carregarCampo("imp-formacao", "formacao");
        carregarCampo("imp-habilidades", "habilidades");
        carregarCampo("imp-socioemocionais", "socioemocionais");
        carregarCampo("imp-valores", "valores");
        carregarCampo("imp-superacao", "superacao");
        carregarCampo("imp-responsabilidades", "responsabilidades");
        carregarCampo("imp-portfolio", "portfolio");

        const fotoSalva = localStorage.getItem(STORAGE_PREFIX + "foto");
        if (fotoSalva) {
            document.getElementById("foto-impressao").src = fotoSalva;
        }

        window.print();
    </script>

</body>
</html>
