<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo – Editável</title>

    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Currículo Profissional – Editável</h1>

        <nav>
            <button class="tab-btn" data-tab="sobre">Sobre</button>
            <button class="tab-btn" data-tab="experiencia">Experiência</button>
            <button class="tab-btn" data-tab="formacao">Formação</button>
            <button class="tab-btn" data-tab="habilidades">Habilidades</button>
            <button class="tab-btn" data-tab="portfolio">Portfólio</button>
        </nav>
    </header>

    <button onclick="window.print()" class="btn-print">Imprimir Currículo</button>

    <main>

        <section id="sobre" class="tab-content active">
            <h2>Sobre mim</h2>
            <textarea class="editable">Escreva aqui um resumo profissional atraente.</textarea>
        </section>

        <section id="experiencia" class="tab-content">
            <h2>Experiência</h2>
            <textarea class="editable">Liste suas experiências profissionais.</textarea>
        </section>

        <section id="formacao" class="tab-content">
            <h2>Formação</h2>
            <textarea class="editable">Adicione seus cursos e certificações.</textarea>
        </section>

        <section id="habilidades" class="tab-content">
            <h2>Habilidades</h2>
            <textarea class="editable">Liste suas competências técnicas e comportamentais.</textarea>
        </section>

        <section id="portfolio" class="tab-content">
            <h2>Portfólio</h2>
            <textarea class="editable">Links, imagens ou projetos desenvolvidos.</textarea>
        </section>

    </main>

    <script>
        const buttons = document.querySelectorAll(".tab-btn");
        const contents = document.querySelectorAll(".tab-content");

        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                const tab = btn.getAttribute("data-tab");

                contents.forEach(c => c.classList.remove("active"));
                document.getElementById(tab).classList.add("active");
            });
        });
    </script>

</body>
</html>
